[editor]
line_numbers = true
syntax_highlighting = true
alternate_buffer = true
markdown_preview_width = 88

[customization]
theme = "tokyo-night"
cursor_marker = "> "
selected_marker = " *"
empty_line_marker = "~"

[autocorrect]
enabled = true

[autocorrect.replacements]
teh = "the"
превет = "привет"

[mcp_servers.rustvim]
command = "cargo"
args = ["run", "--quiet", "--bin", "rustvim-mcp"]
cwd = "/home/occupiednine220/truesandbox"
enabled = true
