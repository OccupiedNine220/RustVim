[package]
name = "rustvim"
version = "0.1.4"
edition = "2021"
description = "A small from-scratch modal terminal editor prototype"
license = "SEE LICENSE IN LICENSE.md"

[dependencies]
async-openai = { version = "0.41.3", features = ["responses"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
toml = "0.9"

[[bin]]
name = "rustvim"
path = "src/main.rs"

[[bin]]
name = "rustvim-mcp"
path = "src/mcp_server.rs"
